<svg viewBox="0 0 80 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="padCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfe0ff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#5c9bd9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#274a70" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- 外枠（金属ベース） -->
  <rect x="0" y="0" width="80" height="24" rx="3" fill="#20262b"/>
  <!-- 発光コア -->
  <rect x="3" y="3" width="74" height="18" rx="2" fill="url(#padCore)"/>
  <!-- 中央のハイライトライン -->
  <rect x="6" y="5" width="68" height="2.5" rx="1.2" fill="#bfe0ff" opacity="0.85"/>
  <!-- 両端の端子 -->
  <circle cx="8" cy="12" r="2" fill="#0d1114"/>
  <circle cx="72" cy="12" r="2" fill="#0d1114"/>
</svg>
