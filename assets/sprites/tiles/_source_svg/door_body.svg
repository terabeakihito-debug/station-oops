<svg viewBox="0 0 64 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c3d44"/>
      <stop offset="45%" stop-color="#2e6b78"/>
      <stop offset="50%" stop-color="#7fe8f5"/>
      <stop offset="55%" stop-color="#2e6b78"/>
      <stop offset="100%" stop-color="#1c3d44"/>
    </linearGradient>
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1c1f"/>
      <stop offset="100%" stop-color="#0d1c1f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="128" fill="url(#doorGrad)"/>

  <!-- 上部の警戒帯 -->
  <rect x="0" y="0" width="64" height="10" fill="#0d1c1f"/>
  <g fill="#ffb347">
    <rect x="2" y="2" width="6" height="6" transform="rotate(45 5 5)"/>
    <rect x="18" y="2" width="6" height="6" transform="rotate(45 21 5)"/>
    <rect x="34" y="2" width="6" height="6" transform="rotate(45 37 5)"/>
    <rect x="50" y="2" width="6" height="6" transform="rotate(45 53 5)"/>
  </g>

  <!-- 下部の警戒帯 -->
  <rect x="0" y="118" width="64" height="10" fill="#0d1c1f"/>
  <g fill="#ffb347">
    <rect x="2" y="120" width="6" height="6" transform="rotate(45 5 123)"/>
    <rect x="18" y="120" width="6" height="6" transform="rotate(45 21 123)"/>
    <rect x="34" y="120" width="6" height="6" transform="rotate(45 37 123)"/>
    <rect x="50" y="120" width="6" height="6" transform="rotate(45 53 123)"/>
  </g>

  <!-- パネルの横筋 -->
  <g stroke="#0d2a30" stroke-width="1.5" opacity="0.7">
    <line x1="0" y1="30" x2="64" y2="30"/>
    <line x1="0" y1="50" x2="64" y2="50"/>
    <line x1="0" y1="78" x2="64" y2="78"/>
    <line x1="0" y1="98" x2="64" y2="98"/>
  </g>

  <!-- 中央の発光ライン（左右の合わせ目・開閉の軸） -->
  <rect x="30" y="10" width="4" height="108" fill="#eafcff" opacity="0.9"/>
  <rect x="26" y="10" width="12" height="108" fill="#7fe8f5" opacity="0.25"/>
</svg>
